<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frutiger Aero / Night</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0a1a3a">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg" class="bg-black"></div>
  <div id="bubbles"></div>

  <!-- Selector de sección: siempre visible -->
  <nav id="modeSwitch" class="mode-switch" data-mode="aero" aria-label="Sección">
    <span class="ms-thumb"></span>
    <button type="button" class="ms-btn active" data-mode="aero" aria-pressed="true">
      <span class="ico ico-sun"></span><span><span class="ms-pre">Frutiger </span>Aero</span>
    </button>
    <button type="button" class="ms-btn" data-mode="night" aria-pressed="false">
      <span class="ico ico-moon"></span><span><span class="ms-pre">Frutiger </span>Night</span>
    </button>
  </nav>

  <!-- Título grande al entrar en cada sección -->
  <div id="modeSplash" data-mode="aero"><h1></h1><p></p></div>

  <div id="stage">
    <div id="logo" class="logo">
      <div class="pawn green">
        <div class="head"></div>
        <div class="body"></div>
      </div>
      <div class="pawn blue">
        <div class="head"></div>
        <div class="body"></div>
      </div>
    </div>

    <div id="cards"></div>
  </div>

  <div id="hint">Haz clic en los peones</div>

  <!-- Moon toggle – bottom right -->
  <button id="moonBtn" class="moon-btn" title="Frutiger Night" aria-label="Cambiar a Frutiger Night">
    <span class="moon-icon"></span>
    <span class="moon-label"></span>
  </button>

  <script src="script.js"></script>
</body>
</html>
